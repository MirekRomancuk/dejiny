<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DEMO 2 — Sticky záhlaví vlády + bannery · Dějiny Koruny české</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: hsl(36 33% 92%);
    --fg: hsl(25 30% 15%);
    --card: hsl(38 30% 88%);
    --primary: hsl(0 100% 27%);
    --accent: hsl(34 76% 44%);
    --border: hsl(34 30% 70%);
    --muted: hsl(25 15% 35%);
    --radius: 0.5rem;

    --cat-foreign: #8b1a1a;
    --cat-domestic: #b8860b;
    --cat-arts: #4b6b57;
    --cat-person: #5a6b8c;
    --cat-place: #8a5a2b;

    --shadow: 0 4px 18px -6px hsl(25 30% 15% / .28);
    --shadow-soft: 0 2px 10px -4px hsl(25 30% 15% / .22);
  }
  html.dark {
    --bg: hsl(25 15% 10%);
    --fg: hsl(36 30% 90%);
    --card: hsl(25 15% 14%);
    --primary: hsl(0 70% 50%);
    --accent: hsl(34 76% 55%);
    --border: hsl(25 15% 25%);
    --muted: hsl(36 20% 70%);
    --shadow: 0 6px 22px -6px hsl(0 0% 0% / .6);
    --shadow-soft: 0 3px 12px -5px hsl(0 0% 0% / .55);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }

  body {
    margin: 0;
    color: var(--fg);
    font-family: 'EB Garamond', serif;
    font-size: 18px;
    line-height: 1.55;
    background-color: var(--bg);
    /* subtle parchment paper texture */
    background-image:
      radial-gradient(hsl(34 40% 60% / .06) 1px, transparent 1px),
      radial-gradient(hsl(34 40% 60% / .05) 1px, transparent 1px),
      linear-gradient(180deg, hsl(36 33% 94%) 0%, var(--bg) 40%, var(--bg) 100%);
    background-size: 22px 22px, 22px 22px, 100% 100%;
    background-position: 0 0, 11px 11px, 0 0;
    transition: background-color .4s ease, color .4s ease;
    min-height: 100vh;
  }
  html.dark body {
    background-image:
      radial-gradient(hsl(34 40% 40% / .05) 1px, transparent 1px),
      radial-gradient(hsl(34 40% 40% / .04) 1px, transparent 1px),
      linear-gradient(180deg, hsl(25 15% 12%) 0%, var(--bg) 45%, var(--bg) 100%);
    background-size: 22px 22px, 22px 22px, 100% 100%;
    background-position: 0 0, 11px 11px, 0 0;
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px 120px; }

  button { font-family: inherit; cursor: pointer; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ============ THEME TOGGLE ============ */
  .theme-toggle {
    position: fixed;
    top: 14px; right: 16px;
    z-index: 60;
    width: 42px; height: 42px;
    display: grid; place-items: center;
    font-size: 1.15rem;
    color: var(--accent);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow-soft);
    transition: transform .25s ease, background .3s ease, color .3s ease;
  }
  .theme-toggle:hover { transform: rotate(-12deg) scale(1.06); }

  /* ============ HEADER BAND ============ */
  header.band {
    text-align: center;
    padding: 46px 16px 26px;
    position: relative;
  }
  .overline {
    font-family: 'Cinzel', serif;
    text-transform: uppercase;
    letter-spacing: .42em;
    font-size: .72rem;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 14px;
  }
  .band h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    font-size: clamp(1.5rem, 3.4vw, 2.5rem);
    color: var(--primary);
    margin: 0 0 6px;
    line-height: 1.15;
  }
  .band .lede {
    font-family: 'Crimson Text', serif;
    font-style: italic;
    font-size: 1.16rem;
    color: var(--muted);
    max-width: 640px;
    margin: 10px auto 0;
  }
  .hairline {
    display: flex; align-items: center; justify-content: center;
    gap: 12px;
    margin: 22px auto 0;
    max-width: 520px;
    color: var(--accent);
  }
  .hairline::before, .hairline::after {
    content: ""; height: 1px; flex: 1;
    background: linear-gradient(90deg, transparent, var(--border), var(--accent), var(--border), transparent);
  }
  .hairline .glyph { font-size: 1.1rem; opacity: .9; }

  /* ============ STICKY RULER BAR ============ */
  .sticky-bar {
    position: sticky;
    top: 0;
    z-index: 40;
    margin: 0 auto 8px;
    max-width: 1200px;
  }
  .sticky-inner {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: linear-gradient(180deg, var(--card), color-mix(in srgb, var(--card) 88%, var(--primary) 12%));
    border: 1px solid var(--border);
    border-top: 3px solid var(--primary);
    border-radius: 0 0 var(--radius) var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(3px);
  }
  .sticky-inner:hover { border-color: var(--accent); }
  .sticky-crest {
    flex: 0 0 auto;
    width: 46px; height: 46px;
    display: grid; place-items: center;
    border-radius: 8px;
    color: var(--accent);
  }
  .sticky-crest svg { width: 46px; height: 46px; display: block; }
  .sticky-mono {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: .82rem;
    fill: var(--accent);
    letter-spacing: .02em;
  }
  .sticky-txt { flex: 1 1 auto; min-width: 0; }
  .sticky-eyebrow {
    font-family: 'Cinzel', serif;
    text-transform: uppercase;
    letter-spacing: .26em;
    font-size: .6rem;
    color: var(--muted);
    display: block;
    margin-bottom: 1px;
  }
  .sticky-name {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.18rem;
    color: var(--primary);
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .sticky-name .years {
    font-family: 'EB Garamond', serif;
    font-weight: 500;
    color: var(--muted);
    font-size: .82rem;
    letter-spacing: .02em;
  }
  .sticky-sub {
    font-family: 'Crimson Text', serif;
    font-style: italic;
    font-size: .92rem;
    color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sticky-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
  .btn-jump {
    font-family: 'Cinzel', serif;
    font-size: .68rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    white-space: nowrap;
    transition: background .2s, color .2s, border-color .2s;
  }
  .btn-jump:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .sticky-progress {
    height: 3px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--border) 70%, transparent);
    margin: 8px 2px 0;
    overflow: hidden;
  }
  .sticky-progress > i {
    display: block; height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    border-radius: 999px;
    transition: width .35s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .sticky-progress > i { transition: none; }
  }
  /* click hint on sticky bar body */
  .sticky-clickzone {
    flex: 1 1 auto; display: flex; align-items: center; gap: 14px;
    background: none; border: none; padding: 0; margin: 0;
    text-align: left; color: inherit; min-width: 0;
  }

  /* ============ TIMELINE ============ */
  .timeline {
    position: relative;
    margin-top: 26px;
    padding-top: 6px;
  }
  /* central spine: two thin lines (wine + gold) */
  .timeline::before,
  .timeline::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    border-radius: 2px;
  }
  .timeline::before {
    left: calc(50% - 2px);
    background: linear-gradient(180deg, transparent, var(--primary) 4%, var(--primary) 96%, transparent);
    opacity: .75;
  }
  .timeline::after {
    left: calc(50% + 1px);
    background: linear-gradient(180deg, transparent, var(--accent) 4%, var(--accent) 96%, transparent);
    opacity: .7;
  }

  /* ---- REIGN BANNER (chapter break) ---- */
  .reign-banner {
    position: relative;
    z-index: 2;
    margin: 34px auto 10px;
    width: min(760px, 100%);
    scroll-margin-top: 96px;
  }
  .reign-banner .banner-card {
    display: flex;
    align-items: center;
    gap: 20px;
    width: 100%;
    text-align: left;
    padding: 18px 22px;
    border: 1px solid var(--border);
    border-left: 5px solid var(--primary);
    border-radius: var(--radius);
    background:
      linear-gradient(180deg, var(--card), color-mix(in srgb, var(--card) 80%, var(--primary) 20%));
    box-shadow: var(--shadow);
    color: var(--fg);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
  }
  .reign-banner .banner-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px -8px hsl(0 60% 20% / .4);
    border-color: var(--accent);
  }
  .banner-crest { flex: 0 0 auto; width: 64px; height: 72px; color: var(--accent); }
  .banner-crest svg { width: 64px; height: 72px; display: block; }
  .banner-mono {
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.05rem; fill: var(--accent);
  }
  .banner-body { flex: 1 1 auto; min-width: 0; }
  .banner-eyebrow {
    font-family: 'Cinzel', serif; text-transform: uppercase; letter-spacing: .3em;
    font-size: .62rem; color: var(--accent); font-weight: 600; margin-bottom: 4px;
  }
  .banner-name {
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: clamp(1.4rem, 2.6vw, 1.95rem);
    color: var(--primary); line-height: 1.1; margin: 0;
  }
  .banner-meta {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-top: 6px;
  }
  .banner-years {
    font-family: 'EB Garamond', serif; font-weight: 600; font-size: 1.02rem; color: var(--fg);
  }
  .banner-house {
    font-family: 'Cinzel', serif; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .14em; color: var(--muted);
  }
  .banner-epithet {
    font-family: 'Crimson Text', serif; font-style: italic; font-size: 1.08rem;
    color: var(--muted); margin-top: 4px; display: block;
  }
  .banner-toggle {
    flex: 0 0 auto;
    font-family: 'Cinzel', serif; font-size: .64rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); background: transparent; border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 10px; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .2s, color .2s, border-color .2s;
  }
  .banner-toggle:hover { color: var(--accent); border-color: var(--accent); }
  .banner-toggle .chev { transition: transform .3s ease; display: inline-block; }
  @media (prefers-reduced-motion: reduce){ .banner-toggle .chev { transition: none; } }
  .reign.collapsed .banner-toggle .chev { transform: rotate(-90deg); }

  /* group container so we can collapse a whole reign */
  .reign { position: relative; }
  .reign .nodes-group {
    overflow: hidden;
    transition: max-height .45s ease, opacity .3s ease;
  }
  @media (prefers-reduced-motion: reduce){ .reign .nodes-group { transition: none; } }
  .reign.collapsed .nodes-group { max-height: 0 !important; opacity: 0; pointer-events: none; }

  /* highlight the reign currently in view */
  .reign.active .banner-card {
    border-left-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent), var(--shadow);
  }

  /* ---- NODES ---- */
  .node {
    position: relative;
    width: calc(50% - 42px);
    margin: 16px 0;
    scroll-margin-top: 100px;
  }
  .node.left  { margin-right: auto; padding-right: 8px; }
  .node.right { margin-left: auto;  padding-left: 8px; }

  /* dot on the spine */
  .node .dot {
    position: absolute;
    top: 22px;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--primary);
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px color-mix(in srgb, var(--accent) 60%, transparent);
    z-index: 3;
  }
  .node.left  .dot { right: -49px; }
  .node.right .dot { left: -49px; }
  /* connector line from card to spine */
  .node .dot::after {
    content: ""; position: absolute; top: 50%; height: 1px;
    width: 34px; background: var(--border);
  }
  .node.left  .dot::after { left: 100%; }
  .node.right .dot::after { right: 100%; }

  .node-card {
    width: 100%;
    text-align: left;
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-soft);
    padding: 12px 15px;
    color: var(--fg);
    transition: transform .18s ease, box-shadow .18s ease, border-color .2s;
  }
  .node-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: var(--accent);
  }
  .node-year {
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 1.5rem; color: var(--primary); line-height: 1;
    display: flex; align-items: baseline; gap: 8px;
  }
  .node-year .count {
    font-family: 'EB Garamond', serif; font-weight: 500; font-size: .72rem;
    color: var(--muted); letter-spacing: .04em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 6px; }
  .chip {
    font-family: 'Cinzel', serif;
    font-size: .58rem; letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 999px; color: #fff;
    white-space: nowrap; line-height: 1.6;
  }
  .snippet {
    font-family: 'Crimson Text', serif;
    font-size: .98rem; color: var(--fg); opacity: .9;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .node-year .chev {
    margin-left: auto; font-size: .8rem; color: var(--muted);
    transition: transform .3s ease; align-self: center;
  }
  @media (prefers-reduced-motion: reduce){ .node-year .chev { transition: none; } }
  .node.expanded .node-year .chev { transform: rotate(90deg); }

  /* expanded events */
  .events {
    max-height: 0; overflow: hidden;
    transition: max-height .4s ease;
    margin-top: 0;
  }
  @media (prefers-reduced-motion: reduce){ .events { transition: none; } }
  .node.expanded .events { margin-top: 10px; }
  .node.expanded .snippet { display: none; }
  .event {
    padding: 8px 10px 8px 12px;
    border-left: 4px solid var(--border);
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .event:last-child { margin-bottom: 0; }
  .event .ev-cat {
    font-family: 'Cinzel', serif; font-size: .58rem; letter-spacing: .08em;
    text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 2px;
  }
  .event .ev-text { font-family: 'EB Garamond', serif; font-size: 1rem; }
  .flag {
    display: inline-block; margin-top: 5px;
    font-family: 'Crimson Text', serif; font-style: italic; font-size: .82rem;
    padding: 1px 9px; border-radius: 999px; border: 1px solid;
  }
  .flag.positive { color: #7a5c00; border-color: #d4af37; background: hsl(45 70% 60% / .16); }
  .flag.negative { color: #7a1a1a; border-color: #a33; background: hsl(0 60% 40% / .14); }
  html.dark .flag.positive { color: #e9c65a; }
  html.dark .flag.negative { color: #e88; }
  .flag::before { content: "✦ "; }

  /* ============ MOBILE ============ */
  @media (max-width: 820px) {
    body { font-size: 17px; }
    .timeline::before { left: 18px; }
    .timeline::after  { left: 21px; }
    .node, .node.left, .node.right {
      width: 100%; margin-left: 0; margin-right: 0;
      padding-left: 46px; padding-right: 0;
    }
    .node.left .dot, .node.right .dot { left: 11px; right: auto; }
    .node.left .dot::after, .node.right .dot::after {
      right: auto; left: 100%; width: 26px;
    }
    .reign-banner { width: 100%; padding-left: 0; }
    .banner-card { padding-left: 16px; }
    .banner-crest { width: 50px; height: 58px; }
    .banner-crest svg { width: 50px; height: 58px; }
    .sticky-sub { display: none; }
    .btn-jump { padding: 6px 9px; }
  }
  @media (max-width: 520px){
    .banner-toggle span.lbl { display: none; }
    .sticky-crest { width: 38px; height: 38px; }
    .sticky-crest svg { width: 38px; height: 38px; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Přepnout světlý / tmavý režim" title="Přepnout režim">☾</button>

<div class="wrap">
  <header class="band">
    <div class="overline">Dějiny Koruny české</div>
    <h1>DEMO 2 — Sticky záhlaví vlády + bannery</h1>
    <p class="lede">Každou vládu otevírá honosný banner s erbem a přídomkem; ať jste kdekoliv, přišpendlená lišta nahoře vám neustále připomíná, kdo právě vládl.</p>
    <div class="hairline"><span class="glyph">♛</span><span class="glyph">⚜</span></div>
  </header>

  <!-- STICKY RULER BAR -->
  <div class="sticky-bar" id="stickyBar">
    <div class="sticky-inner">
      <button class="sticky-clickzone" id="stickyClick" aria-label="Sbalit / rozbalit aktuální vládu">
        <span class="sticky-crest" id="stickyCrest" aria-hidden="true"></span>
        <span class="sticky-txt">
          <span class="sticky-eyebrow">Právě vládne</span>
          <span class="sticky-name" id="stickyName">—</span>
          <span class="sticky-sub" id="stickySub"></span>
        </span>
      </button>
      <div class="sticky-actions">
        <button class="btn-jump" id="jumpBtn" title="Skočit na začátek této vlády">▲ na začátek vlády</button>
      </div>
    </div>
    <div class="sticky-progress" title="Postup napříč vládou"><i id="stickyProgress"></i></div>
  </div>

  <!-- TIMELINE (built by JS) -->
  <main class="timeline" id="timeline" aria-label="Časová osa panovníků"></main>
</div>

<script>
/* ============ DATA ============ */
const RULERS = [
  { id:1, name:'Bořivoj I.',   from:872, to:889, house:'Přemyslovci', epithet:'první křesťanský kníže', mono:'BI' },
  { id:2, name:'Spytihněv I.', from:894, to:915, house:'Přemyslovci', epithet:'', mono:'SI' },
  { id:3, name:'Vratislav I.', from:915, to:921, house:'Přemyslovci', epithet:'', mono:'VI' },
  { id:4, name:'sv. Václav',   from:921, to:935, house:'Přemyslovci', epithet:'zemský patron', mono:'V' },
  { id:5, name:'Boleslav I.',  from:935, to:972, house:'Přemyslovci', epithet:'Ukrutný', mono:'BI' },
  { id:6, name:'Boleslav II.', from:972, to:999, house:'Přemyslovci', epithet:'Pobožný', mono:'BII' },
];
const NODES = [
  { year:874, rulerId:1, events:[{cat:'domestic', text:'Bořivoj přijímá křest od arcibiskupa Metoděje na Moravě', highlight:'positive'}] },
  { year:883, rulerId:1, events:[{cat:'place', text:'Přenesení sídla z Levého Hradce na Pražský hrad'},{cat:'arts', text:'Stavba kostela Panny Marie na Hradě'}] },
  { year:895, rulerId:2, events:[{cat:'foreign', text:'Čeští předáci se v Řezně poddávají Východofranské říši'}] },
  { year:908, rulerId:2, events:[{cat:'arts', text:'Rozvoj hradiště a řemesel'}] },
  { year:915, rulerId:3, events:[{cat:'domestic', text:'Nástup knížete Vratislava I.'}] },
  { year:921, rulerId:4, events:[{cat:'domestic', text:'Nástup Václava; regentství kněžny Drahomíry'},{cat:'person', text:'Babička sv. Ludmila'}] },
  { year:929, rulerId:4, events:[{cat:'foreign', text:'Vpád Jindřicha Ptáčníka, uzavření míru'},{cat:'arts', text:'Založení rotundy sv. Víta na Hradě'}] },
  { year:935, rulerId:4, events:[{cat:'domestic', text:'Vražda knížete Václava ve Staré Boleslavi', highlight:'negative'}] },
  { year:950, rulerId:5, events:[{cat:'foreign', text:'Boleslav I. uznává svrchovanost Oty I.'}] },
  { year:955, rulerId:5, events:[{cat:'foreign', text:'Bitva na řece Lechu — účast českých oddílů', highlight:'positive'}] },
  { year:965, rulerId:5, events:[{cat:'person', text:'Zpráva kupce Ibráhíma ibn Jákúba o Praze'}] },
  { year:973, rulerId:6, events:[{cat:'arts', text:'Založení pražského biskupství', highlight:'positive'}] },
  { year:982, rulerId:6, events:[{cat:'person', text:'Vojtěch Slavníkovec zvolen pražským biskupem'}] },
  { year:995, rulerId:6, events:[{cat:'domestic', text:'Vyvraždění Slavníkovců na Libici', highlight:'negative'}] },
];

const CAT_LABELS = {
  foreign:'Zahraniční politika', domestic:'Domácí politika',
  arts:'Vzdělanost a umění', person:'Osobnosti', place:'Místa'
};
const CAT_COLORS = {
  foreign:'#8b1a1a', domestic:'#b8860b', arts:'#4b6b57', person:'#5a6b8c', place:'#8a5a2b'
};
const HIGHLIGHT_LABELS = { positive:'světlá chvíle', negative:'temná hodina' };

/* ============ HELPERS ============ */
const $  = (s, r=document) => r.querySelector(s);
const el = (tag, cls, txt) => { const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
const rulerById = id => RULERS.find(r => r.id === id);
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Small heraldic shield crest with monogram inside */
function crestSVG(mono, w, h){
  return `<svg viewBox="0 0 60 68" width="${w}" height="${h}" role="img" aria-hidden="true">
    <defs></defs>
    <path d="M4 4 H56 V34 C56 52 42 62 30 66 C18 62 4 52 4 34 Z"
          fill="none" stroke="currentColor" stroke-width="2.2" opacity=".55"/>
    <path d="M4 4 H56 V34 C56 52 42 62 30 66 C18 62 4 52 4 34 Z"
          fill="currentColor" opacity=".08"/>
    <line x1="4" y1="18" x2="56" y2="18" stroke="currentColor" stroke-width="1" opacity=".35"/>
    <text x="30" y="42" text-anchor="middle" class="crest-mono"
          style="font-family:'Cinzel',serif;font-weight:700;font-size:15px;fill:currentColor">${mono}</text>
  </svg>`;
}

/* ============ BUILD TIMELINE ============ */
const timeline = $('#timeline');
const reignEls = [];   // { ruler, bannerEl, groupEl, reignEl, nodeEls:[], firstNodeYear, lastNodeYear }

let nodeSideIndex = 0; // alternate left/right across ALL nodes for consistent rhythm

// group nodes by ruler, in data order
const order = [];
NODES.forEach(n => { if(!order.includes(n.rulerId)) order.push(n.rulerId); });

order.forEach(rid => {
  const ruler = rulerById(rid);
  const groupNodes = NODES.filter(n => n.rulerId === rid);

  // --- reign wrapper ---
  const reign = el('section', 'reign');
  reign.dataset.rulerId = rid;

  // --- BANNER ---
  const banner = el('div', 'reign-banner');
  banner.id = 'reign-' + rid;
  banner.dataset.rulerId = rid;

  const card = el('div', 'banner-card');
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-label', `Vláda: ${ruler.name} ${ruler.from}–${ruler.to}. Kliknutím sbalíte či rozbalíte tuto vládu.`);

  const crest = el('span', 'banner-crest');
  crest.innerHTML = crestSVG(ruler.mono, 64, 72);

  const body = el('div', 'banner-body');
  body.appendChild(el('div', 'banner-eyebrow', 'Vláda panovníka'));
  body.appendChild(el('h2', 'banner-name', ruler.name));
  const meta = el('div', 'banner-meta');
  meta.appendChild(el('span', 'banner-years', `${ruler.from} – ${ruler.to}`));
  meta.appendChild(el('span', 'banner-house', ruler.house));
  body.appendChild(meta);
  if (ruler.epithet) body.appendChild(el('span', 'banner-epithet', '„' + ruler.epithet + '“'));

  const toggle = el('button', 'banner-toggle');
  toggle.type = 'button';
  toggle.innerHTML = '<span class="chev">▾</span><span class="lbl">sbalit</span>';
  toggle.setAttribute('aria-expanded', 'true');

  card.appendChild(crest);
  card.appendChild(body);
  card.appendChild(toggle);
  banner.appendChild(card);
  reign.appendChild(banner);

  // --- NODES GROUP ---
  const group = el('div', 'nodes-group');
  const nodeEls = [];

  groupNodes.forEach(n => {
    const side = (nodeSideIndex % 2 === 0) ? 'left' : 'right';
    nodeSideIndex++;

    const node = el('article', 'node ' + side);
    node.id = 'node-' + n.year;
    node.dataset.rulerId = rid;

    const dot = el('span', 'dot');
    node.appendChild(dot);

    const nc = el('button', 'node-card');
    nc.type = 'button';
    nc.setAttribute('aria-expanded', 'false');

    // year row
    const yearRow = el('div', 'node-year');
    yearRow.appendChild(document.createTextNode(String(n.year)));
    const cnt = el('span', 'count', `${n.events.length} ${n.events.length===1?'událost':'události'}`);
    yearRow.appendChild(cnt);
    const chev = el('span', 'chev', '›');
    yearRow.appendChild(chev);
    nc.appendChild(yearRow);

    // chips (unique categories present)
    const cats = [...new Set(n.events.map(e => e.cat))];
    const chips = el('div', 'chips');
    cats.forEach(c => {
      const chip = el('span', 'chip', CAT_LABELS[c]);
      chip.style.background = CAT_COLORS[c];
      chips.appendChild(chip);
    });
    nc.appendChild(chips);

    // snippet (first event)
    nc.appendChild(el('div', 'snippet', n.events[0].text));

    // events (expanded)
    const events = el('div', 'events');
    n.events.forEach(ev => {
      const eDiv = el('div', 'event');
      eDiv.style.borderLeftColor = CAT_COLORS[ev.cat];
      const catLbl = el('span', 'ev-cat', CAT_LABELS[ev.cat]);
      catLbl.style.color = CAT_COLORS[ev.cat];
      eDiv.appendChild(catLbl);
      eDiv.appendChild(el('div', 'ev-text', ev.text));
      if (ev.highlight) {
        const flag = el('span', 'flag ' + ev.highlight, HIGHLIGHT_LABELS[ev.highlight]);
        eDiv.appendChild(flag);
      }
      events.appendChild(eDiv);
    });
    nc.appendChild(events);

    // expand/collapse a single node
    const toggleNode = () => {
      const open = node.classList.toggle('expanded');
      nc.setAttribute('aria-expanded', String(open));
      if (open) {
        events.style.maxHeight = events.scrollHeight + 'px';
      } else {
        events.style.maxHeight = '0px';
      }
    };
    nc.addEventListener('click', toggleNode);

    node.appendChild(nc);
    group.appendChild(node);
    nodeEls.push({ node, events, year:n.year });
  });

  reign.appendChild(group);
  timeline.appendChild(reign);

  // set group max-height for smooth reign collapse
  requestAnimationFrame(() => { group.style.maxHeight = group.scrollHeight + 'px'; });

  const rec = {
    ruler, bannerEl: banner, groupEl: group, reignEl: reign, toggleBtn: toggle,
    cardEl: card, nodeEls,
    firstNodeYear: groupNodes[0].year,
    lastNodeYear: groupNodes[groupNodes.length-1].year
  };
  reignEls.push(rec);

  /* ---- reign collapse/expand ---- */
  const toggleReign = () => {
    const collapsed = reign.classList.toggle('collapsed');
    if (!collapsed) {
      // re-measure in case fonts/layout changed
      group.style.maxHeight = group.scrollHeight + 'px';
    }
    toggle.setAttribute('aria-expanded', String(!collapsed));
    toggle.querySelector('.lbl').textContent = collapsed ? 'rozbalit' : 'sbalit';
  };
  toggle.addEventListener('click', (e) => { e.stopPropagation(); toggleReign(); });
  card.addEventListener('click', (e) => { if (e.target.closest('.banner-toggle')) return; toggleReign(); });
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleReign(); }
  });
});

/* recompute group heights on resize (line wraps change scrollHeight) */
let resizeTO;
window.addEventListener('resize', () => {
  clearTimeout(resizeTO);
  resizeTO = setTimeout(() => {
    reignEls.forEach(r => {
      if (!r.reignEl.classList.contains('collapsed')) r.groupEl.style.maxHeight = r.groupEl.scrollHeight + 'px';
    });
    // expanded nodes too
    document.querySelectorAll('.node.expanded').forEach(n => {
      const ev = n.querySelector('.events');
      ev.style.maxHeight = ev.scrollHeight + 'px';
    });
  }, 150);
});

/* ============ STICKY BAR + IntersectionObserver ============ */
const stickyName = $('#stickyName');
const stickySub  = $('#stickySub');
const stickyCrest= $('#stickyCrest');
const stickyProgress = $('#stickyProgress');
const jumpBtn = $('#jumpBtn');
const stickyClick = $('#stickyClick');

let currentReign = null;   // rec of the reign currently "in view"

function setSticky(rec){
  if (rec === currentReign) { updateProgress(); return; }
  currentReign = rec;
  const r = rec.ruler;
  stickyCrest.innerHTML = crestSVG(r.mono, 46, 46);
  stickyName.innerHTML = `${r.name} <span class="years">${r.from}–${r.to}</span>`;
  stickySub.textContent = r.epithet ? ('„' + r.epithet + '“ · ' + r.house) : r.house;

  reignEls.forEach(x => x.reignEl.classList.toggle('active', x === rec));
  updateProgress();
}

/* progress = how far the reading line has advanced from the reign's banner top
   to the next reign's banner top (or bottom of last group) */
function updateProgress(){
  if (!currentReign) return;
  const line = window.innerHeight * 0.30; // reading line, matches rootMargin
  const idx = reignEls.indexOf(currentReign);
  const topA = currentReign.bannerEl.getBoundingClientRect().top;
  let topB;
  if (idx < reignEls.length - 1) {
    topB = reignEls[idx+1].bannerEl.getBoundingClientRect().top;
  } else {
    const rect = currentReign.groupEl.getBoundingClientRect();
    topB = rect.bottom;
  }
  const span = topB - topA;
  let pct = span > 0 ? (line - topA) / span : 0;
  pct = Math.max(0, Math.min(1, pct));
  stickyProgress.style.width = (pct * 100).toFixed(1) + '%';
}

/* Determine active reign by which banner/nodes cross a reading line near top.
   We track vertical positions on scroll for robustness (works when collapsed too). */
function pickActiveReign(){
  const line = window.innerHeight * 0.30;
  let chosen = reignEls[0];
  for (const rec of reignEls){
    const top = rec.bannerEl.getBoundingClientRect().top;
    if (top - 8 <= line) chosen = rec;   // last reign whose banner has passed the line
    else break;
  }
  setSticky(chosen);
}

/* Use IntersectionObserver as the trigger, plus a scroll listener for smooth progress.
   Observe banners with a rootMargin that defines the reading line at 30% from top. */
const io = new IntersectionObserver(() => { pickActiveReign(); }, {
  root: null,
  rootMargin: '-30% 0px -69% 0px',
  threshold: [0, 1]
});
reignEls.forEach(r => { io.observe(r.bannerEl); r.nodeEls.forEach(n => io.observe(n.node)); });

let ticking = false;
window.addEventListener('scroll', () => {
  if (!ticking) {
    window.requestAnimationFrame(() => { pickActiveReign(); ticking = false; });
    ticking = true;
  }
}, { passive: true });

/* sticky bar interactions */
jumpBtn.addEventListener('click', () => {
  if (!currentReign) return;
  // ensure reign is expanded so target is meaningful, then scroll to banner
  currentReign.reignEl.classList.remove('collapsed');
  currentReign.groupEl.style.maxHeight = currentReign.groupEl.scrollHeight + 'px';
  currentReign.toggleBtn.setAttribute('aria-expanded', 'true');
  currentReign.toggleBtn.querySelector('.lbl').textContent = 'sbalit';
  currentReign.bannerEl.scrollIntoView({ behavior: prefersReduced ? 'auto' : 'smooth', block: 'start' });
});

stickyClick.addEventListener('click', () => {
  if (!currentReign) return;
  const rec = currentReign;
  const collapsed = rec.reignEl.classList.toggle('collapsed');
  if (!collapsed) rec.groupEl.style.maxHeight = rec.groupEl.scrollHeight + 'px';
  rec.toggleBtn.setAttribute('aria-expanded', String(!collapsed));
  rec.toggleBtn.querySelector('.lbl').textContent = collapsed ? 'rozbalit' : 'sbalit';
});

/* init sticky after layout settles */
requestAnimationFrame(() => { pickActiveReign(); updateProgress(); });
setTimeout(() => { reignEls.forEach(r => { if(!r.reignEl.classList.contains('collapsed')) r.groupEl.style.maxHeight = r.groupEl.scrollHeight + 'px'; }); updateProgress(); }, 400);

/* ============ THEME TOGGLE ============ */
const themeToggle = $('#themeToggle');
function applyTheme(dark){
  document.documentElement.classList.toggle('dark', dark);
  themeToggle.textContent = dark ? '☀' : '☾';
  themeToggle.setAttribute('aria-pressed', String(dark));
}
applyTheme(false); // default light
themeToggle.addEventListener('click', () => {
  applyTheme(!document.documentElement.classList.contains('dark'));
});
</script>
</body>
</html>
